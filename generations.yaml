    description: "The Chevrolet Blazer EV is the brand's first electric mid-size SUV, built on GM's dedicated Ultium EV platform (GM BEV3). Introduced in 2022 and going on sale in mid-2023, the model offers FWD, RWD (2023-2025), and AWD configurations across trim levels (2LT, RS, and SS). The performance-oriented SS model delivers 557 HP and 648 lb-ft of torque, enabling 0-60 mph acceleration in under 4 seconds with the WOW (Wide Open Watts) mode. Battery capacity options include 85 kWh and 102 kWh Ultium units, with EPA-estimated range from 279 miles (85 kWh AWD) to 324 miles (102 kWh RWD). The interior features a 17.7-inch infotainment touchscreen (first vehicle with GM Ultifi system) and an 11-inch driver information center. DC fast charging supports up to 195 kW, allowing approximately 78 miles of range in 10 minutes. Manufactured in Ramos Arizpe, Mexico, the Blazer EV serves as a key model in Chevrolet's electric vehicle strategy, positioned between the compact Equinox EV and larger Silverado EV pickup truck."
